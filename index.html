<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17141F" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Essensplan">
  <meta name="description" content="Rezepte und Abendessen für die Woche planen – mit Einkaufsliste.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="bilder/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="bilder/apple-touch-icon.png">
  <link rel="preload" href="schriften/nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="schriften/fredoka.woff2" as="font" type="font/woff2" crossorigin>
  <title>Essensplan</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="kopfzeile">
    <button class="kopf-knopf" id="zurueck" type="button" aria-label="Zurück" hidden></button>
    <div class="kopf-titel">
      <span id="untertitel" hidden></span>
      <h1 id="seitentitel">Essensplan</h1>
    </div>
    <div id="kopf-aktionen"></div>
  </header>

  <!-- Hier zeigt app.js die jeweils aktive Ansicht an -->
  <main id="inhalt"></main>

  <nav class="navigation" aria-label="Hauptnavigation">
    <a href="#/kalender" data-ansicht="kalender">
      <span class="nav-symbol" data-symbol="kalender"></span>
      <span>Woche</span>
    </a>
    <a href="#/rezepte" data-ansicht="rezepte">
      <span class="nav-symbol" data-symbol="buch"></span>
      <span>Rezepte</span>
    </a>
    <a href="#/kategorien" data-ansicht="kategorien">
      <span class="nav-symbol" data-symbol="etikett"></span>
      <span>Kategorien</span>
    </a>
  </nav>
</body>
</html>
